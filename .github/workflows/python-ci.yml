name: python-ci

# Stage-1A verification gate (no secrets, no provider access, no model calls).
# Runs the same gate we require locally and in scripts/verify-stage0.sh:
#   - pytest
#   - mypy
#   - ruff check
#   - ruff format --check
#   - compileall
#   - git diff --check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      # actions/checkout@v4 (pinned to the exact SHA used by the successful run)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python@v5 (pinned to the exact SHA used by that run)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      # Tool versions pinned to the versions verified against this repo
      # (recorded 2026-08-21): pytest 9.1.1, mypy 2.1.0, ruff 0.16.3.
      # ruff 0.16.3 is the authoritative pin now used both in CI and the
      # devcontainer (.devcontainer/Dockerfile).
      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 mypy==2.1.0 ruff==0.16.3

      - name: pytest
        run: PYTHONPATH=src python -m pytest -q

      - name: mypy
        run: mypy src tests

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: compileall
        run: python -m compileall -q src tests scripts

      - name: git diff check
        run: git diff --check
